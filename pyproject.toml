[project]
name = "ava"
version = "0.1.0"
description = "Agentic AI Telegram Bot - Your Personal Assistant"
authors = [{name = "Ava Team"}]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Bot framework
    "python-telegram-bot[job-queue]>=20.7",

    # LLM
    "google-generativeai>=0.8.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",

    # Redis
    "redis>=5.0.0",

    # HTTP
    "httpx>=0.28.0",

    # Configuration & utilities
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",

    # Logging
    "structlog>=24.4.0",

    # Security
    "cryptography>=44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
    "ipython>=8.30.0",
    "types-redis>=4.6.0",
]

[project.scripts]
ava = "src.main:main"

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | alembic
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"